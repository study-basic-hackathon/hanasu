services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      # ソースをホストと共有し、ホスト側の編集をコンテナに反映させる
      - .:/app
      # node_modules と .next はコンテナ側に分離する。
      # bind mount だけだとホスト側の内容で上書きされてしまうため、名前付きボリュームで隠す
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  node_modules:
  next_cache:
