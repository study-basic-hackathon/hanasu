[project]
name = "backend"
version = "0.1.0"
description = "hanasu API backend"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "anthropic[bedrock]>=0.122.0",
    "bcrypt>=5.0.0",
    "boto3>=1.43.72",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx2>=0.1.0",
]
